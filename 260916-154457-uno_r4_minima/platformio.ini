; PlatformIO Project Configuration File
;
; Pick the firmware from the PlatformIO environment list (status bar),
; or run `pio run -e <name> -t upload`:
;
;   uno_r4_minima   src/sample_code_R1.cpp
;                   fixed -0.7 / +0.7 sweep
;   auto_tuner      src/auto_tuner/sample_code_R1.cpp
;                   runtime "C a1 b1 b0" and "M radians" commands
;
; A bare `pio run` builds uno_r4_minima only.

[platformio]
default_envs = uno_r4_minima

[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
monitor_speed = 230400
build_src_filter = +<*> -<auto_tuner/>

[env:auto_tuner]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
monitor_speed = 230400
build_src_filter = -<*> +<auto_tuner/>
